<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
        <div class="header-container">
            <!-- [PERSONALIZÁVEL] Nome/Logo da sua universidade -->
            <div class="logo">Universidade de Miracema</div>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="programação.html">Programação</a></li>
                    <li><a href="inscricao.html" class="active">Inscrição</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="form-section">
            <h2>Formulário de Inscrição</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="estudante@universidade.edu.br">
                </div>
                <div class="form-group">
                    <label for="curso">Curso:</label>
                    <input type="text" id="curso" name="curso" required placeholder="Ex: Ciência da Computação">
                </div>
                <div class="form-group">
                    <label for="periodo">Período / Semestre:</label>
                    <select id="periodo" name="periodo" required>
                        <option value="">Selecione o seu período</option>
                        <option value="1">1º Período</option>
                        <option value="2">2º Período</option>
                        <option value="3">3º Período</option>
                        <option value="4">4º Período</option>
                        <option value="5">5º Período ou superior</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="evento">Evento Desejado:</label>
                    <select id="evento" name="evento" required>
                        <option value="">Selecione o evento de interesse</option>
                        <option value="ia">Palestra sobre Inovação Tecnológica</option>
                        <option value="web">Aula de Programação em Python</option>
                        <option value="ux">Design de Frontend</option>
                        <option value="escrita">Encontro de leitores do Tocantins</option>
                        <option value="inovacao">Exercícios de musculação</option>
                        <option value="robotica">Oficina de Robótica</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Modalidade de Participação:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="modalidade" value="presencial" required checked> Presencial</label>
                        <label><input type="radio" name="modalidade" value="online"> Online (Transmissão)</label>
                    </div>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="termo" name="termo" required>
                    <label for="termo">Declaro que as informações fornecidas acima são verdadeiras.</label>
                </div>
                <button type="submit" class="btn-submit">Confirmar Inscrição</button>

            </form>
        </section>
    </main>
</body>
</html>
